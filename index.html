<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マイ帳簿サイト</title>
<link rel="stylesheet" href="style.css?v=0.2I1d">
</head>
<body>
<header>
  <h1>マイ帳簿サイト</h1>
  <div class="header-right">
    <span id="user-email" class="user"></span>
    <span id="version" class="version">v0.2（手順I1d：一覧の移動ボタン・見出し固定）</span>
    <button id="btn-logout" type="button" class="header-btn" hidden>ログアウト</button>
  </div>
</header>

<nav id="nav" hidden>
  <button type="button" data-tab="entry">記帳</button>
  <button type="button" data-tab="trial">試算表</button>
  <button type="button" data-tab="ledger">元帳・検索</button>
  <button type="button" data-tab="settings">設定</button>
</nav>

<div id="backup-banner" class="bkbanner" hidden></div>

<main>
  <section id="logged-out">
    <p>Googleアカウントでログインしてください。</p>
    <button id="btn-login" type="button" class="primary">Googleでログイン</button>
  </section>
  <p id="error" class="error" hidden></p>
  <section id="view" hidden></section>
</main>

<div id="modal" hidden></div>

<script type="module" src="app.js?v=0.2I1d"></script>
</body>
</html>
